<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>

    <!--
      首屏图片预载
      ------------------------------------------------------------------
      入场加载器需要「全部图片下载并解码完成」才揭幕，这些图片本来就是
      必经之路。默认情况下浏览器要等 JS 下载、解析、Vue 挂载之后才开始
      请求它们；在这里声明 preload，可以让它们与 JS 包并行下载，
      提前数百毫秒开始，且不改变任何最终的视觉结果。

      与 useEntryLoader.js 的 HOME_IMAGE_PATHS / DEFAULT_BACKGROUND_IMAGES 保持一致。
      bg1 未转 WebP（原 PNG 已足够高效），因此这里仍是 .png。
    -->
    <link rel="preload" as="image" href="%BASE_URL%assets/images/background/bg1.png" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/background/bg2.webp" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/background/bg3.webp" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/welcome.webp" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/lantern_festival.webp" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/information.webp" />
    <link rel="preload" as="image" href="%BASE_URL%assets/avatar.webp" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
