name: 文档问题
description: 报告文档错误、缺失或链接失效
title: "[文档] "
labels: ["documentation"]
body:
  - type: input
    id: file
    attributes:
      label: 文档路径
      placeholder: docs/架构/数据流.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 哪一段不准确、缺失或难以理解？
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      description: 可直接给出替换文本

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 已确认该问题不是「已知行为与陷阱」中记录的行为
          required: true
