name: 功能建议
description: 提出新功能或体验改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述使用场景，而不是直接给实现方案。路线图见 `docs/产品/路线图.md`。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么情况下会遇到？现在的做法哪里不方便？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你希望看到什么变化？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 可选

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 首页
        - 归档
        - 分类
        - 系列
        - 详情阅读
        - 搜索
        - 快捷链接
        - 内容写作
        - 构建 / 部署
        - 文档 / AI 协作

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该建议不需要引入后端或账号系统
          required: true
