name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]

  # 允许手动触发部署
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署在运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youngblog
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: youngblog/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 注意：这里必须用 npm run build（base 为 /），不能用 build:github（base 为 /YoungBlog/）。
      # 站点挂了自定义域名后，GitHub Pages 会把项目站发布在【根路径】，
      # /YoungBlog/ 这个前缀根本不存在 —— 用它构建出来的 index.html 会指向
      # /YoungBlog/assets/*.js，结果整站资源全 404（白屏）。
      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: youngblog/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
